[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metropt-predictive-maintenance"
version = "0.1.0"
description = "MetroPT APU Predictive Maintenance System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Developer" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "polars>=0.20.0",
    "pandera[polars]>=0.18.0",
    "pandas>=2.0.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "optuna>=3.0.0",
    "shap>=0.42.0",
    "captum>=0.6.0",
    "dvc>=3.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytest>=7.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
